image: python:3.11-slim

stages:
  - test

data_agent_tests:
  stage: test
  rules:
    - changes:
        - agents/data_agent/**/*
        - interfaces/**/*
        - .gitlab-ci.yml
  script:
    - cd agents/data_agent
    - python -m unittest discover -s tests -v

